name: Codespell

on:
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          skip: '.git,assets,node_modules,package-lock.json'
          ignore_words_list: 'aitesters,jaktestowac,iff,testin'
